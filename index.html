<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" 
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="/app.js"></script>
    <title>Contato</title>
</head>
<body class="d-flex align-items-center py-4 bg-body-tertiary">
    <main class="w-100 m-auto form-container">
        <form>
            <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" fill="currentColor" class="bi bi-person-circle" viewBox="0 0 16 16">
                <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
                <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
            </svg>
            <h1 class="h3 mb-3 fw-normal">Preencha seus dados</h1>

            <div>
                <label for="input-nome">Nome</label>
                <input type="text" class="form-control" id="input-nome" placeholder="Nome" required/>
            </div>
            <div>
                <label for="input-telefone">Telefone</label>
                <input type="tel" class="form-control" id="input-telefone" placeholder="(11) 99999-9999" required/>
            </div>
            <div>
                <label for="input-email">E-mail</label>
                <input type="email" class="form-control" id="input-email" placeholder="exemplo@email.com" required/>
            </div>
            <div>
                <label for="input-endereco">Endereço</label>
                <input type="text" class="form-control" id="input-endereco" placeholder="Endereço" required/>
            </div>
            <div>
                <label for="input-cidade">Cidade</label>
                <input type="text" class="form-control" id="input-cidade" placeholder="Ex. São Paulo" required/>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 mt-3">Enviar</button>
        </form>
    </main>
</body>
</html>
