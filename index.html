<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="./app.js" defer type="module"></script>
    <title>Contatos</title>
</head>
<body>

  <div class="">
    <div class="card">
      <div class="card-header">
        <span class="label">CADASTRO</span>
        <h1>Seus <em>dados</em></h1>
        <p>Preencha as informações abaixo para continuar.</p>
      </div>

      <form class="form" novalidate>

        <div class="field">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" name="nome" placeholder="Nome" required />
        </div>

        <div class="field">
          <label for="contato">Contato <span>(telefone)</span></label>
          <input type="tel" id="contato" name="contato" placeholder="(11) 9 0000-0000" required />
        </div>

        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="seu@email.com" required />
        </div>

        <div class="field">
          <label for="idade">Idade</label>
          <input type="number" id="idade" name="idade" placeholder="Ex: 28" min="1" max="120" required />
        </div>

        <button type="submit" class="btn">Enviar cadastro</button>
      </form>
    </div>

    <div class="decoration">
      <div class="circle c1"></div>
      <div class="circle c2"></div>
      <div class="circle c3"></div>
    </div>
  </div>
</html>
