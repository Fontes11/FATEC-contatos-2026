<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Editar Contato</title>
</head>
<body class="bg-body-tertiary" style="padding-top: 70px;">
    <main class="w-100 m-auto form-container">

        <!-- Navegação -->
    <nav class="navbar navbar-dark bg-dark w-100 fixed-top">
        <div class="container-fluid justify-content-center gap-4">
            <a href="index.html"   class="btn btn-primary">Cadastrar</a>
            <a href="editar.html"  class="btn btn-warning">Editar</a>
            <a href="deletar.html" class="btn btn-danger">Deletar</a>
        </div>
    </nav>

        <!-- Formulário de edição (oculto até selecionar um contato) -->
        <form id="form-editar" class="d-none">
            <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" fill="currentColor" class="bi bi-person-circle" viewBox="0 0 16 16">
                <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
                <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
            </svg>
            <h1 class="h3 mb-3 fw-normal">
                Editando contato <span id="titulo-id" class="badge bg-warning text-dark fs-6"></span>
            </h1>

            <input type="hidden" id="contato-id"/>

            <div>
                <label for="input-nome">Nome</label>
                <input type="text" class="form-control" id="input-nome" required/>
            </div>
            <div>
                <label for="input-telefone">Telefone</label>
                <input type="tel" class="form-control" id="input-telefone" required/>
            </div>
            <div>
                <label for="input-email">E-mail</label>
                <input type="email" class="form-control" id="input-email" required/>
            </div>
            <div>
                <label for="input-endereco">Endereço</label>
                <input type="text" class="form-control" id="input-endereco" required/>
            </div>
            <div>
                <label for="input-cidade">Cidade</label>
                <input type="text" class="form-control" id="input-cidade" required/>
            </div>

            <button type="submit" class="btn btn-warning w-100 py-2 mt-3">Salvar alterações</button>
            <button type="button" id="btn-cancelar" class="btn btn-outline-secondary w-100 py-2 mt-2">Cancelar</button>
        </form>

        <!-- Lista de contatos -->
        <section class="mt-5">
            <h2 class="h5 mb-3">Selecione um contato para editar</h2>
            <div id="lista-contatos">
                <p class="text-secondary">Carregando contatos...</p>
            </div>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmQqHvvXhcPJTXzTwfKQ7JRQY" crossorigin="anonymous"></script>
    <script type="module" src="/app.js"></script>
</body>
</html>
